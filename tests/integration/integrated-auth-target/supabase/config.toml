# Entirely isolated Website destination; Reserve schema is prebootstrapped.
project_id = "veni_integrated_website_target_ci"

[experimental]
stack = true

[api]
enabled = true
schemas = ["public", "reserve"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false
